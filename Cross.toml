# cross 0.2.5's default aarch64-gnu image is Ubuntu 16.04 (glibc 2.23), which lacks
# statx (glibc 2.28+) used by current std and sysinfo. The :main image is Ubuntu
# 20.04 (glibc 2.31), still old enough to run on e.g. Raspberry Pi OS.
[target.aarch64-unknown-linux-gnu]
image = "ghcr.io/cross-rs/aarch64-unknown-linux-gnu:main"
